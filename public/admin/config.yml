backend:
  name: github
  repo: oliver492/ocarina
  branch: main
  auth_endpoint: auth

locale: zh_Hans
publish_mode: simple
media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 归档文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{published}} · {{title}}"
    sortable_fields: [published, title]
    nested: &article_nested
      depth: 10
      summary: "{{title}}"
      subfolders: false
    meta: &article_meta
      path:
        widget: string
        label: 子目录
        required: false
        hint: 留空保存在当前栏目根目录；已发布文章请保留原目录，以免改变网址。
    fields: &article_fields
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        default: "{{now}}"
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - label: 更新日期
        name: updated
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
      - label: 摘要
        name: description
        widget: text
        required: false
        default: ""
      - label: 封面图片
        name: image
        widget: image
        required: false
        default: ""
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        field: { label: 标签, name: tag, widget: string }
      - label: 分类
        name: category
        widget: string
        required: false
        default: ""
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 草稿不会显示在博客；保存在公开仓库时，他人仍可查看原文件。
      - label: 文章语言
        name: lang
        widget: select
        required: false
        default: zh_CN
        options:
          - { label: 简体中文, value: zh_CN }
          - { label: English, value: en }
      - label: 正文
        name: body
        widget: markdown

  - name: notes
    label: 随记
    label_singular: 随记
    folder: src/content/notes
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{published}} · {{title}}"
    sortable_fields: [published, title]
    nested: *article_nested
    meta: *article_meta
    fields: *article_fields

  - name: projects
    label: 项目
    label_singular: 项目文章
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{published}} · {{title}}"
    sortable_fields: [published, title]
    nested: *article_nested
    meta: *article_meta
    fields: *article_fields
